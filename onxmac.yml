
---
- hosts: localhost
  gather_facts: false
  become: no
  vars:
    nixpkgs_url: "https://github.com/NixOS/nixpkgs/tarball/nixos-26.05"
    nix_packages:
      - curl
      - direnv
      - fzf
      - gdal
      - git
      - google-cloud-sdk
      - imagemagick
      - jq
      - nodejs
      - python3
      - python3Packages.pip
      - ripgrep
      - tmux
      - vim
      - ntfy
      - osmium-tool
      - tippecanoe
      - gh
      - pmtiles
      - htop
      - httpie
      - aria2
      - pandoc
      #- nur.repos.sikmir.osmosis
      #- codex
      - nix-direnv
      - zoxide
      - docker-sbx # for now manually added NIXPKGS_ALLOW_UNFREE=1 to ~/.zshrc.local
      - jira-cli-go
  roles:
    - role: nix
      tags: nix
    - role: dotfiles
      tags: dotfiles
  tasks:
    - name: Install Claude Code
      become: no
      ansible.builtin.shell: |
        curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: ~/.local/bin/claude
    - homebrew_cask: name={{ item }}
      tags:
        - brew
        - never
      with_items:
        - google-chrome # preinstalled
        - firefox
        - ghostty
        - bettertouchtool
        - meld
        - google-cloud-sdk
        - dbeaver-community
        - inkscape
        - gimp
        - mark-text
        - umd
        - qgis
