- name: Install dotfiles
  become: no
  copy: src={{ item }} dest=~/.{{ item }}
  with_items:
    - bashrc
    - bash_profile
    - bash_logout
    - vimrc
    - gitignore
    - gitconfig
    - gitconfig-onx
    - inputrc
    - tmux.conf
    - zshrc
