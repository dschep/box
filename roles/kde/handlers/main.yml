---
- name: Reload KWin configuration
  become: no
  shell: |
    if command -v qdbus6 >/dev/null 2>&1; then
      qdbus6 org.kde.KWin /KWin reconfigure
    elif command -v qdbus >/dev/null 2>&1; then
      qdbus org.kde.KWin /KWin reconfigure
    elif command -v dbus-send >/dev/null 2>&1; then
      dbus-send --session --dest=org.kde.KWin /KWin org.kde.KWin.reconfigure
    fi
  failed_when: false
  changed_when: false

- name: Restart shortcuts service
  become: no
  shell: |
    if command -v systemctl >/dev/null 2>&1 && systemctl --user is-active plasma-kglobalaccel.service >/dev/null 2>&1; then
      systemctl --user restart plasma-kglobalaccel.service
    else
      for cmd in kquitapp6 kquitapp5; do
        if command -v $cmd >/dev/null 2>&1; then
          $cmd kglobalaccel
          sleep 1
          daemon=$(echo $cmd | sed 's/kquitapp/kglobalaccel/')
          if command -v $daemon >/dev/null 2>&1; then
            $daemon &
            break
          fi
        fi
      done
    fi
  failed_when: false
  changed_when: false
