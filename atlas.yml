---
- import_playbook: linux-workstation.yml
- hosts: localhost
  gather_facts: false
  become: yes
  roles:
    - sshd
  tags:
    - host-specific
  tasks:
    - package: name={{ item }}
      with_items:
        - nfs-common
    - name: Create nas mountpoint
      ansible.builtin.file:
        path: /mnt/nas
        state: directory
        mode: '0755'
    - name: Create nas mountpoint
      ansible.builtin.file:
        path: /mnt/nas
        state: directory
        mode: '0755'
    - name: Mount nas
      ansible.posix.mount:
        path: /mnt/nas
        src: nas.maplewood.schep.me:/volume1/data
        fstype: nfs4
        opts: rw,sync,hard,intr
        state: mounted
    - name: Add SSH authorized_key
      ansible.posix.authorized_key:
        user: dschep
        state: present
        key: |
          ssh-rsa  dschep@potassium
          ssh-rsa  dschep@atlas
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINOpDl1o5Ib0LHYzt7jCBIlhT6P+55UTx2Wb+ChQDF5Z danielschep@005465.local
