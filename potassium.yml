---
- hosts: potassium
  become: yes
  roles:
    - base
    - atkinson_hyperlegible
    - alacritty
    - nvm
- hosts: potassium
  become: yes
  tasks:
    - package: name={{ item }}
      with_items:
        - gimp
        - inkscape
        - gimp
        - firefox
        - just
        - httpie
        - docker
    # kde settings
    # focus follows mouse, 100ms
    # virtual desktops & shortcuts
    # modifier key for window movement/resizing - alt
    # default term - alacritty
    # close window - alt-shift-c
    # krunner - alt-p
    # maximize - alt-f
    # fonts to atkinson hyperlegible
    # launch alacritty - alt-shift-enter
    #
    #
    #
    # rm .config/alacritty/alacritty.toml
    #
