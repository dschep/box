---
# manual: enable contrib & non-free repos
# manual: sudo apt install unattended-upgrades && sudo dpkg-reconfigure unattended-upgrades
- hosts: potassium
  become: yes
  roles:
    - dotfiles
    #- base_utils # not directly using bc vim vs gvim
    - atkinson_hyperlegible
    - alacritty
    - fnm # needed to make .local/bin
    - kde
- hosts: potassium
  become: yes
  tasks:
    - package: name={{ item }}
      with_items:
        - gimp
        - inkscape
        - gimp
        - firefox-esr
        - just
        - httpie
        #- docker
        - ripgrep
        - wl-clipboard
        - chromium
        - meld
        - aria2
        - vlc
        # base_utils (but s/vim/gvim/)
        - bash
        - zsh
        - fzf
        - tmux
        - vim-gtk3
        - git
        - curl

